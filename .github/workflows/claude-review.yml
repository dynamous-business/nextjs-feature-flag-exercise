# Claude review: read-only. Runs the piv-review-pr skill against the PR and
# posts the review as a PR comment. Claude reads code and comments; it never
# writes to the branch (contents: read).
#
# Fires when a PR is opened or marked ready, and on demand when a trusted
# contributor comments `@claude-review`. PRs from forks get no secrets, so
# they never spend the key.
name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '@claude-review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read         # read-only: the reviewer never edits the branch
      pull-requests: write   # post the review as a comment
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude-review"
          track_progress: true
          prompt: |
            Review pull request #${{ github.event.pull_request.number || github.event.issue.number }}
            against its base branch, using the review bar in .claude/skills/piv-review-pr/SKILL.md
            and the conventions in CLAUDE.md.

            Do the whole review yourself, in this session: do not launch subagents or background
            tasks, and do not install dependencies or run the test suite (this job only reviews).
            Read the diff with `gh pr diff`, then read the files it touches.

            Check correctness, edge cases, security, error handling, test coverage, and CLAUDE.md
            compliance. Post ONE comment: a verdict line, then findings worst-first, each marked
            BLOCKER, SHOULD-FIX or NIT, each citing file:line. Do not modify any files and do not
            approve or merge.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
